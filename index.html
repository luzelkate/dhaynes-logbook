return '<div class="panel"><b>Backup (Excel file)</b><div class="note" style="margin:4px 0 10px">Your records are saved only on this phone. Save a backup every day, then send the file to yourself (Messenger, email, or Google Drive). You can open it in Excel to read everything.</div><div class="note"><b>'+lb+'</b></div><div class="row" style="margin-top:10px"><button class="pri" id="dl">Save backup to phone</button><button id="sh">Send backup</button></div><div id="bkmsg" class="note"></div></div>'+
'<div class="panel"><b>Restore from backup</b><div class="note" style="margin:4px 0 10px">Use this if you changed phones or your records are gone. Step 1: choose your backup file (.xlsx). Step 2: tap Restore. This replaces what is on this phone now.</div><input type="file" id="bf" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><div id="bkmsg2" class="note" style="margin:8px 0"></div><button id="rs">Restore from backup</button></div>'}

function sizeRow(chk){return '<div class="row"><select id="sz" aria-label="Size">'+S.settings.sizes.map(function(x){return '<option value="'+esc(x.n)+'"'+(x.n==="25L"?" selected":"")+'>'+esc(x.n)+' (₱'+x.p+')</option>'}).join("")+'</select>'+fld("pr","Price ₱","number","sm")+'</div><div class="row"><label style="display:flex;gap:8px;align-items:center;flex:1"><input type="checkbox" id="pd"'+(chk?' checked':'')+' style="width:20px;height:20px"> Already paid</label><button class="pri" id="go">Add</button></div>'}
function ap(d){var a=S.settings.auto||{min:30,rate:10},q=0;S.entries.forEach(function(e){if(e.type==="deliver"&&!e.void&&e.date===d&&pr(e)>=a.min)q+=e.qty});return{q:q,amt:q*a.rate,rate:a.rate,min:a.min}}
function autoRow(){var a=ap(day());return '<div class="item"><div class="n">Delivery boy (auto)<small>'+a.q+' pcs at ₱'+a.min+' and up × ₱'+a.rate+' = '+peso(a.amt)+'</small></div><span class="q">'+peso(a.amt)+'</span></div>'}
function autoP(){var a=S.settings.auto||{min:30,rate:10};return '<div class="panel"><b>Delivery boy pay (automatic)</b><div class="note" style="margin:4px 0 10px">Every delivered piece priced at or above the amount below adds this pay to Salary automatically.</div><div class="row"><div><div class="note">Pay per piece (₱)</div><input id="arate" type="number" inputmode="numeric" value="'+a.rate+'"></div><div><div class="note">For prices from (₱)</div><input id="amin" type="number" inputmode="numeric" value="'+a.min+'"></div></div></div>'}
function sz(e){return e.size||"25L"}
function sp(n){var f=S.settings.sizes.filter(function(x){return x.n===n})[0];return f?f.p:S.settings.price}
function fillPrice(){var s=document.getElementById("sz"),p=document.getElementById("pr"),n=document.getElementById("nm");if(!s||!p)return;p.value=S.cust[(n?n.value.trim().toLowerCase():"")+"|"+s.value]||sp(s.value)}
function pb(r){var m={},c={};live("deliver").concat(live("refill")).forEach(function(e){var k=(e.type==="refill"?"Refill ":"Deliver ")+sz(e)+" × ₱"+pr(e);m[k]=(m[k]||0)+e.qty*pr(e);c[k]=(c[k]||0)+e.qty});return Object.keys(m).map(function(k){return r(c[k]+" pc · "+esc(k),peso(m[k]))}).join("")}
function log(action,desc){S.audit.unshift({ts:Date.now(),action:action,desc:desc})}
function day(){return document.getElementById("date").value}
function list(type){return S.entries.filter(function(e){return e.date===day()&&e.type===type})}
function live(type){return list(type).filter(function(e){return !e.void})}
function sum(type,f){return live(type).reduce(function(a,e){return a+(f?f(e):e.qty||0)},0)}
function add(type,o){o.id=Date.now()+Math.random();o.date=day();o.type=type;o.ts=Date.now();o.void=false;S.entries.push(o);
log("Added",(LBL[type]||type)+": "+(o.name?o.name+" ":"")+(o.qty?o.qty+" pc ":"")+(o.size?o.size+" ":"")+(o.price?"@₱"+o.price+" ":"")+(o.amt?peso(o.amt):"")+" ("+o.date+")");save();render()}
function find(id){return S.entries.filter(function(e){return e.id===id})[0]}
function toggleVoid(id){var e=find(id);e.void=!e.void;log(e.void?"Voided":"Restored",(LBL[e.type]||e.type)+": "+(e.name||"")+" "+(e.qty||"")+" "+(e.amt||"")+" ("+e.date+")");save();render()}
function togglePaid(id){var e=find(id);e.paid=!e.paid;e.paidDate=e.paid?today():null;log(e.paid?"Marked paid":"Back to unpaid",(e.name||"Walk-in")+" "+e.qty+" pc × ₱"+pr(e)+" (order: "+e.date+(e.paid?", paid on: "+e.paidDate:"")+")");save();render()}
function fld(id,ph,type,cls){return '<input id="'+id+'" placeholder="'+ph+'" '+(type?'type="'+type+'" inputmode="numeric" min="0"':'')+' class="'+(cls||"")+'" aria-label="'+ph+'">'}
function val(id){var e=document.getElementById(id);return e?e.value.trim():""}
function items(type,fn){var l=list(type);if(!l.length)return '<div class="empty">Nothing logged for this date.</div>';
return l.map(function(e){return '<div class="item"><div class="n '+(e.void?"void":"")+'">'+fn(e)+'</div>'+
'<button data-void="'+e.id+'" aria-label="'+(e.void?"Restore":"Void")+'">'+(e.void?"Restore":"Void")+'</button></div>'}).join("")}
function render(){
var tb=document.getElementById("tabs");
tb.innerHTML=TABS.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>'}).join("");
var h="";
if(tab==="refill"){
h='<div class="panel"><div class="row">'+fld("nm","Customer (optional)")+fld("q","Qty","number","sm")+'</div>'+sizeRow(true)+'<div class="note">Refill = containers brought in and refilled at the station.</div></div><div class="panel">'+
items("refill",function(e){return esc(e.name||"Walk-in")+' <button class="tag '+(e.paid?"pd":"ut")+'" data-paid="'+e.id+'" style="background:none">'+(e.paid?"paid":"unpaid")+'</button><small>'+esc(sz(e))+' · '+peso(pr(e))+' × '+e.qty+' = '+peso(e.qty*pr(e))+'</small>'})+
'<div class="item"><div class="n"><b>Total refill</b><small>'+peso(sum("refill",function(e){return e.qty*pr(e)}))+'</small></div><span class="q">'+sum("refill")+'</span></div></div>'}
if(tab==="deliver"){
h='<div class="panel"><div class="row">'+fld("nm","Customer / store name")+fld("q","Qty","number","sm")+'</div>'+
'<div class="row"><select id="sz" aria-label="Size">'+S.settings.sizes.map(function(x){return '<option value="'+esc(x.n)+'"'+(x.n==="25L"?" selected":"")+'>'+esc(x.n)+' (₱'+x.p+')</option>'}).join("")+'</select>'+fld("pr","Price ₱","number","sm")+'</div><div class="row"><label style="display:flex;gap:8px;align-items:center;flex:1"><input type="checkbox" id="pd" style="width:20px;height:20px"> Already paid</label><button class="pri" id="go">Add</button></div></div><div class="panel">'+
items("deliver",function(e){return esc(e.name)+' <button class="tag '+(e.paid?"pd":"ut")+'" data-paid="'+e.id+'" style="background:none">'+(e.paid?"paid":"unpaid")+'</button><small>'+esc(sz(e))+' · '+peso(pr(e))+' × '+e.qty+' = '+peso(e.qty*pr(e))+'</small>'}).replace(/<span/g,"<span")+
'<div class="item"><div class="n"><b>Total delivered</b></div><span class="q">'+sum("deliver")+'</span></div></div>'}
if(tab==="gastos"){
h='<div class="panel"><div class="row">'+fld("nm","What for (e.g. fuel)")+fld("a","₱","number","sm")+'</div><button class="pri" id="go" style="width:100%">Add</button></div><div class="panel">'+
items("gastos",function(e){return esc(e.name||"Expense")+'<small>'+peso(e.amt)+'</small>'})+
'<div class="item"><div class="n"><b>Total expenses</b></div><span class="q">'+peso(sum("gastos",function(e){return e.amt}))+'</span></div></div>'}
if(tab==="sahod"){
h='<div class="panel"><div class="row">'+fld("nm","Who (e.g. driver)")+fld("a","₱","number","sm")+'</div><button class="pri" id="go" style="width:100%">Add</button></div><div class="panel">'+
autoRow()+items("sahod",function(e){return esc(e.name||"Salary")+'<small>'+peso(e.amt)+'</small>'})+
'<div class="item"><div class="n"><b>Total salary</b></div><span class="q">'+peso(sum("sahod",function(e){return e.amt})+ap(day()).amt)+'</span></div></div>'}
if(tab==="buod"){
var dq=sum("deliver"),sd=sum("deliver",function(e){return e.qty*pr(e)}),sr=sum("refill",function(e){return e.qty*pr(e)}),benta=sd+sr,bayad=sum("deliver",function(e){return e.paid?e.qty*pr(e):0})+sum("refill",function(e){return e.paid?e.qty*pr(e):0}),
g=sum("gastos",function(e){return e.amt}),s=sum("sahod",function(e){return e.amt})+ap(day()).amt,net=benta-g-s,col=S.entries.filter(function(e){return (e.type==="deliver"||e.type==="refill")&&!e.void&&e.paid&&(e.paidDate||e.date)===day()}).reduce(function(a,e){return a+e.qty*pr(e)},0),cash=col-g-s,rf=sum("refill");
function r(l,v,c){return '<tr><td>'+l+'</td><td class="'+(c||"")+'">'+v+'</td></tr>'}
h='<div class="panel"><table class="sum">'+r("Delivered",dq+" pc")+r("Refilled",rf+" pc")+pb(r)+r("Sales",peso(benta))+
r("− Expenses",peso(g))+r("− Salary",peso(s))+'<tr class="t"><td>Profit</td><td class="'+(net<0?"neg":"pos")+'">'+peso(net)+'</td></tr></table></div>'+
'<div class="panel"><table class="sum">'+r("Paid",peso(bayad),"pos")+r("Still unpaid",peso(benta-bayad),benta-bayad?"neg":"")+r("Collected today (incl. past unpaid)",peso(col))+r("Cash on hand (collected − expenses − salary)",peso(cash),cash<0?"neg":"")+
r("Delivery sales",peso(sd))+r("Refill sales",peso(sr))+'</table></div>'+
ut()+bkp()+autoP()}
if(tab==="audit"){
h='<div class="panel"><div class="note">Every addition, void, and change is recorded here. Voiding an entry never removes its record.</div>'+
(S.audit.length?S.audit.slice(0,150).map(function(a){return '<div class="aud"><time>'+new Date(a.ts).toLocaleString("en-PH")+'</time><b>'+esc(a.action)+'</b> · '+esc(a.desc)+'</div>'}).join(""):'<div class="empty">No records yet.</div>')+'</div>'}
document.getElementById("view").innerHTML=h;if(tab==="deliver")fillPrice()}
document.addEventListener("click",function(ev){var t=ev.target;
if(t.dataset.tab){tab=t.dataset.tab;render();return}
if(t.dataset.void){toggleVoid(+t.dataset.void);return}
if(t.dataset.paid){togglePaid(+t.dataset.paid);return}
if(t.id==="go"){var q=+val("q")||0,a=document.getElementById("a")?+val("a")||0:0,nm=document.getElementById("nm")?val("nm"):"";
if((tab==="refill"&&q>0)||(tab==="deliver"&&q>0&&nm)){var zz=val("sz"),pp=+val("pr")||sp(zz);S.cust[nm.toLowerCase()+"|"+zz]=pp;var pk=document.getElementById("pd").checked;add(tab,{name:nm,qty:q,size:zz,price:pp,paid:pk,paidDate:pk?day():null})}
else if((tab==="gastos"||tab==="sahod")&&a>0)add(tab,{name:nm,amt:a})}
if(t.id==="dl")xdl("Saved! ");
if(t.id==="sh"){var f2=null;try{f2=new File([xbook()],xname(),{type:XT})}catch(e){}
if(f2&&navigator.canShare&&navigator.share&&navigator.canShare({files:[f2]})){navigator.share({files:[f2],title:"Dhayne's backup"}).then(function(){S.settings.lastBackup=Date.now();save();document.getElementById("bkmsg").textContent="Sent! Backup saved."}).catch(function(){document.getElementById("bkmsg").textContent="Sending was cancelled. Tap Send backup again."})}
else xdl("Your phone cannot send files from here, so the file was saved instead. ")}
if(t.id==="rs"){var m2=document.getElementById("bkmsg2");if(!pend){m2.textContent="Please choose your backup file first."}else{var o=pend;o.settings=o.settings||{price:30};if(!o.settings.sizes)o.settings.sizes=[{n:"7L pababa",p:10},{n:"8-10L",p:15},{n:"25L",p:30}];o.cust=o.cust||{};o.audit=o.audit||[];S=o;pend=null;log("Restore","Restored from backup");save();render()}}
});
document.addEventListener("change",function(ev){if(ev.target.id==="bf"){var fl=ev.target.files[0],mm=document.getElementById("bkmsg2");pend=null;if(fl){mm.textContent="Reading file...";fl.arrayBuffer().then(xread).then(xdata).then(function(o){pend=o;mm.textContent="Backup found with "+o.entries.length+" records. Now tap Restore."}).catch(function(){mm.textContent="This is not a Dhayne backup file. Please choose the .xlsx file you saved from this app."})}}if(ev.target.id==="sz")fillPrice();
if(ev.target.id==="arate"||ev.target.id==="amin"){var ar=S.settings.auto||{min:30,rate:10};if(ev.target.id==="arate")ar.rate=+ev.target.value||0;else ar.min=+ev.target.value||0;S.settings.auto=ar;log("Settings","Delivery boy pay: ₱"+ar.rate+" per piece from ₱"+ar.min);save();render()}if(ev.target.id==="tiers"){var t=ev.target.value.split(",").map(function(x){var a=x.split("="),v=(a[1]||"").split("/").map(function(y){return +y.trim()}).filter(function(y){return y>0});return{n:a[0].trim(),p:v[0]||0,a:v.slice(1)}}).filter(function(x){return x.n&&x.p>0});if(t.length){var f=function(l){return l.map(function(x){return x.n+"=₱"+x.p}).join("/")};log("Prices",f(S.settings.sizes)+" → "+f(t));S.settings.sizes=t;save();render()}}});
document.getElementById("date").addEventListener("change",render);
document.addEventListener("input",function(ev){if(ev.target.id==="nm")fillPrice()});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});
load();document.getElementById("date").value=today();render();
</script>
</body>
</html>
